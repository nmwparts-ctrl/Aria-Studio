<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Deep Sea Cyber Biotope - Cinematic Realistic Waves</title>
    <style>
        :root {
            --water-bg: #010408;
            --neon-blue: #00f2ff;
            --neon-gold: #ffae00;
            --deep-sea: #000814;
        }

        body {
            margin: 0; padding: 0; background: #000;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
            height: 100vh; font-family: 'Consolas', 'Courier New', monospace;
        }

        /* 硬件层容器：采用多层高透光渐变，确保画布半透明时能透出深邃的赛博海底 */
        #biotope-wrapper {
            width: 1920px; height: 350px;
            position: relative;
            background: linear-gradient(180deg, 
                rgba(0, 180, 216, 0.4) 0%, 
                rgba(0, 48, 96, 0.75) 40%,
                rgba(1, 8, 24, 0.95) 100%);
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
            overflow: hidden;
            border: 1px solid #1a1a1a;
        }

        canvas { 
            /* 激活 GPU 硬件渲染加速 */
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
            perspective: 1000;
            image-rendering: -webkit-optimize-contrast;
        }

        #status-deck {
            position: absolute; top: 15px; left: 20px;
            color: var(--neon-blue); font-size: 13px;
            letter-spacing: 2px; opacity: 0.8; pointer-events: none;
            z-index: 5; text-shadow: 0 0 8px rgba(0, 242, 255, 0.5);
            line-height: 1.5;
        }

        #brand-tag {
            position: absolute; bottom: 20px; right: 30px;
            color: var(--neon-blue); font-size: 28px;
            font-weight: 900; letter-spacing: 2px;
            opacity: 0.5; pointer-events: none;
            z-index: 10; text-shadow: 0 0 15px var(--neon-blue);
            font-style: italic; font-family: 'Arial Black', sans-serif;
        }

        #input-handler { position: absolute; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

<input type="text" id="input-handler" autofocus>
<div id="biotope-wrapper">
    <div id="status-deck">
        SYS.READY // MODE: NORMAL<br>
        WPM: 0 // COMBO: 0 // PROGRESS: 0%
    </div>
    <canvas id="biotopeCanvas"></canvas>
    <div id="brand-tag">DS</div>
</div>

<script>
    const canvas = document.getElementById('biotopeCanvas');
    // 启用画布透明通道以支持半透明水体效果
    const ctx = canvas.getContext('2d', { alpha: true }); 
    const input = document.getElementById('input-handler');
    const statusDeck = document.getElementById('status-deck');
    const brandTag = document.getElementById('brand-tag');

    canvas.width = 1920;
    canvas.height = 350;

    let keyBuffer = "";
    
    const State = {
        mode: 'NORMAL',
        wpm: 0,
        combo: 0,
        colorShiftIndex: 0, 
        isDark: false,
        isNeon: false,
        particles: [],
        shocks: [], 
        redGiant: null,
        waterLevel: 130 
    };

    class Organism {
        constructor(config, id) {
            this.id = id;
            this.type = config.type;
            this.baseColor = config.color;
            this.currentColor = config.color;
            this.scale = config.scale;
            this.baseSpeed = config.speed;
            this.burst = 0;
            this.vx = 0;
            this.vy = 0;
            this.init();
        }

        init() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * (canvas.height - 180) + 160;
            this.dir = Math.random() > 0.5 ? 1 : -1;
            this.phase = Math.random() * Math.PI * 2;
        }

        update() {
            let boost = State.combo > 20 ? 1.4 : 1.0;
            let speed = (this.baseSpeed + this.burst) * boost;
            
            this.x += (speed * this.dir) + this.vx;
            this.y += (Math.sin(this.phase) * 0.6) + this.vy;
            
            this.vx *= 0.93;
            this.vy *= 0.93;
            this.burst *= 0.95;

            if (this.x > canvas.width + 300) this.x = -300;
            if (this.x < -300) this.x = canvas.width + 300;

            this.phase += (this.type === 'giant' ? 0.01 : 0.04);

            if (this.type === 'small') {
                // 击键转换后的小鱼使用高饱和度的暴走电光红
                this.currentColor = (this.id < State.colorShiftIndex) ? '#ff003c' : this.baseColor;
            }

            if (this.y < State.waterLevel - 30) {
                this.vy += 0.5; 
                if (Math.random() > 0.5) createSplash(this.x, this.y + 10, this.currentColor);
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            if (this.dir < 0) ctx.scale(-1, 1);

            const sway = Math.sin(this.phase * 2) * (this.type === 'giant' ? 12 : 6);
            
            if (this.type === 'giant') {
                ctx.globalAlpha = (State.combo > 80) ? 0.08 : (State.isDark ? 0.1 : 0.45);
                this.drawGiant(sway, this.baseColor);
            } else {
                // 进入高 COMBO 或 NEON 模式时，使用极其鲜艳的超饱和赛博幻彩色系
                let c = (State.isNeon || State.combo > 50) ? `hsl(${(this.id * 22 + Date.now()/8)%360}, 100%, 60%)` : this.currentColor;
                
                ctx.globalAlpha = 1.0; // 纯实心绘制确保色彩高鲜艳度不穿透
                this.drawSmall(c, sway);
            }
            ctx.restore();
        }

        drawGiant(sway, color) {
            const l = 200 * this.scale, h = 50 * this.scale;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-l*0.2, -h+sway, -l*0.3, h+sway, 0, 0);
            ctx.bezierCurveTo(l*0.4, h*1.2, l*0.9, h*0.8, l, 0);
            ctx.bezierCurveTo(l*0.9, -h*0.8, l*0.4, -h*1.2, 0, 0);
            ctx.fill();
        }

        drawSmall(color, sway) {
            const l = 35 * this.scale, h = 12 * this.scale;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(0, 0); ctx.lineTo(-l*0.4, -h*0.7+sway); ctx.lineTo(-l*0.4, h*0.7-sway);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(0, 0); ctx.bezierCurveTo(l*0.4, h, l*0.8, h, l, 0); ctx.bezierCurveTo(l*0.8, -h, l*0.4, -h, 0, 0);
            ctx.fill();
            
            // 鱼眼
            ctx.fillStyle = "#fff";
            ctx.beginPath(); ctx.arc(l*0.75, -h*0.15, 2, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#000";
            ctx.beginPath(); ctx.arc(l*0.78, -h*0.15, 1, 0, Math.PI*2); ctx.fill();
        }
    }

    // 巨型鱼颜色加深（#08111e）；小鱼全部采用更鲜艳夺目的赛博原色（#00f5ff 冰极霓虹蓝，#ff6700 电光炽橙）
    const giants = Array.from({ length: 4 }, (_, i) => new Organism({ type: 'giant', color: '#08111e', scale: 1.1, speed: 2 }, i));
    const smalls = Array.from({ length: 45 }, (_, i) => new Organism({ type: 'small', color: i%2? '#00f5ff':'#ffae00', scale: 1.0, speed:1.5 }, i));

    function createSplash(x, y, color) {
        for (let i = 0; i < 4; i++) {
            State.particles.push({
                x: x + (Math.random()-0.5)*10, y: y,
                vx: (Math.random()-0.5)*4, vy: -Math.random()*4-1,
                life: 1.0, color: color, size: Math.random()*2+1
            });
        }
    }

    window.addEventListener('keydown', (e) => {
        input.focus();
        State.combo++;
        State.wpm += 1.8;
        State.colorShiftIndex = Math.floor(State.combo / 3);

        if (State.colorShiftIndex >= smalls.length && !State.redGiant) {
            State.redGiant = { x: -800, y: 175, alpha: 0.9 };
        }

        if (e.key === ' ' || e.key === 'Enter') {
            const waveX = Math.random() * canvas.width;
            const waveY = Math.random() * canvas.height;
            State.shocks.push({ x: waveX, y: waveY, r: 0, alpha: 1, color: `hsl(${Math.random()*360}, 100%, 65%)` });

            smalls.forEach(s => {
                const dx = s.x - waveX, dy = s.y - waveY, dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 350) {
                    const angle = Math.atan2(dy, dx);
                    const power = (350 - dist) / 350 * 25;
                    s.vx += Math.cos(angle) * power; s.vy += Math.sin(angle) * power; s.burst = 5;
                }
            });

            if (e.key === ' ') {
                const g = giants[Math.floor(Math.random()*giants.length)];
                g.vy = -18; g.burst = 6;
                State.shocks.push({ x: g.x, y: State.waterLevel, r: 0, alpha: 1, color: '#00ffff' });
            }
        }

        keyBuffer += e.key.toLowerCase();
        if (keyBuffer.length > 10) keyBuffer = keyBuffer.substring(1);
        if (keyBuffer.endsWith('dark')) State.isDark = !State.isDark;
        if (keyBuffer.endsWith('neon')) State.isNeon = !State.isNeon;
    });

    let waveTime = 0;

    function animate() {
        // 使用带有 Alpha 通道的半透明深蓝色刷底，清除前一帧的同时保留清澈的水体通透感与发光尾迹
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = State.isDark ? "rgba(1, 4, 12, 0.6)" : "rgba(1, 14, 38, 0.32)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (State.wpm > 0) State.wpm -= 0.05;
        
        let currentMode = "NORMAL";
        if (State.combo > 80) currentMode = "GHOST";
        else if (State.combo > 50) currentMode = "NEON";
        else if (State.combo > 20) currentMode = "TURBO";

        const progress = Math.min(100, Math.floor((State.colorShiftIndex / smalls.length) * 100));
        statusDeck.innerHTML = `SYS.READY // MODE: ${currentMode}<br>WPM: ${Math.floor(State.wpm)} // COMBO: ${Math.floor(State.combo)} // PROGRESS: ${progress}%`;

        brandTag.style.color = (State.colorShiftIndex >= smalls.length) ? '#ff003c' : 'var(--neon-blue)';

        // 绘制最终红巨星（鲜艳暴走红）
        if (State.redGiant) {
            let rg = State.redGiant; rg.x += 25;
            ctx.save();
            ctx.translate(rg.x, rg.y);
            ctx.globalAlpha = rg.alpha; ctx.fillStyle = "#ff003c";
            ctx.beginPath(); ctx.ellipse(0, 0, 450, 150, 0, 0, Math.PI*2); ctx.fill();
            ctx.restore();
            if (rg.x > canvas.width + 600) { State.combo = 0; State.colorShiftIndex = 0; State.redGiant = null; }
        }

        // 绘制高色彩冲击波纹
        State.shocks.forEach((s, i) => {
            ctx.save(); ctx.strokeStyle = s.color; ctx.globalAlpha = s.alpha; ctx.lineWidth = 3;
            for(let j=0; j<3; j++) { ctx.beginPath(); ctx.arc(s.x, s.y, Math.max(0, s.r - j*20), 0, Math.PI*2); ctx.stroke(); }
            ctx.restore();
            s.r += 10; s.alpha -= 0.03;
            if(s.alpha <= 0) State.shocks.splice(i, 1);
        });

        // 物种逻辑更新与绘制
        giants.forEach(g => { g.update(); g.draw(); });
        smalls.forEach(s => { s.update(); s.draw(); });

        // 绘制物理浪花
        State.particles.forEach((p, i) => {
            ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life -= 0.03;
            if(p.life <= 0) State.particles.splice(i, 1);
        });

        // 🌊 升级版逼真复合海浪算法逻辑
        waveTime += 0.022; 
        ctx.save();

        // Layer 1: 底层深邃涌浪（低频、大振幅，模拟远端宏观海浪基底）
        ctx.fillStyle = "rgba(0, 36, 92, 0.38)";
        ctx.beginPath();
        ctx.moveTo(0, canvas.height);
        for (let x = 0; x <= canvas.width; x += 30) {
            let y = (State.waterLevel + 20) 
                    + Math.sin(x * 0.0015 - waveTime * 0.6) * 42 
                    + Math.cos(x * 0.0045 + waveTime * 0.4) * 12; // 双重低频波干涉
            ctx.lineTo(x, y);
        }
        ctx.lineTo(canvas.width, canvas.height);
        ctx.closePath();
        ctx.fill();

        // Layer 2: 中层高通透渐变波浪（模拟次表面散射，增加立体厚度）
        let waterGrad = ctx.createLinearGradient(0, State.waterLevel - 30, 0, canvas.height);
        waterGrad.addColorStop(0, "rgba(0, 150, 199, 0.45)");
        waterGrad.addColorStop(0.3, "rgba(0, 48, 96, 0.25)");
        waterGrad.addColorStop(1, "rgba(1, 4, 12, 0)");
        ctx.fillStyle = waterGrad;
        ctx.beginPath();
        ctx.moveTo(0, canvas.height);
        for (let x = 0; x <= canvas.width; x += 15) {
            let y = (State.waterLevel + 5) 
                    + Math.sin(x * 0.0035 - waveTime * 1.1) * 35 
                    + Math.sin(x * 0.012 + waveTime * 1.8) * 8; // 引入向前推进的中频破碎波
            ctx.lineTo(x, y);
        }
        ctx.lineTo(canvas.width, canvas.height);
        ctx.closePath();
        ctx.fill();

        // Layer 3: 顶层主空气幕落（多频傅里叶级数叠加，创造真实细密的动态浪尖）
        let surfacePoints = [];
        for (let x = canvas.width; x >= 0; x -= 10) {
            let y = State.waterLevel 
                    + Math.sin(x * 0.0028 + waveTime * 1.4) * 38   // 基础大波浪
                    + Math.cos(x * 0.0075 - waveTime * 2.3) * 15   // 快速次波浪
                    + Math.sin(x * 0.022 + waveTime * 3.5) * 4;     // 表层微弱涟漪毛刺
            surfacePoints.push({x: x, y: y});
        }
        
        ctx.fillStyle = "rgba(0, 4, 12, 0.90)"; 
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(canvas.width, 0);
        surfacePoints.forEach(p => ctx.lineTo(p.x, p.y));
        ctx.closePath();
        ctx.fill();

        // Layer 4: 2.5D 水面霓虹折光边缘亮带（利用混色与发光让浪尖晶莹剔透）
        ctx.globalCompositeOperation = 'screen';
        ctx.strokeStyle = "rgba(0, 242, 255, 0.5)";
        ctx.lineWidth = 2.0;
        ctx.shadowColor = "rgba(0, 242, 255, 0.6)";
        ctx.shadowBlur = 10; // 形成水面发光滤镜
        ctx.beginPath();
        surfacePoints.forEach((p, idx) => {
            if(idx === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
        });
        ctx.stroke();

        ctx.restore();

        requestAnimationFrame(animate);
    }
    animate();
</script>
</body>
</html>
