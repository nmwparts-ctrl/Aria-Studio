<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>301mm×55mm 战机控制终端 (A527 绝对兼容满帧版)</title>
    <style>
        /* 全局零溢出刚性流控锁 */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden !important;
            background: transparent !important; /* 背景完全透明 */
            user-select: none;
            -webkit-user-select: none;
        }

        .terminal-wrapper {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            background: transparent !important;
        }

        .stage-container {
            flex: 1;
            min-height: 0;
            min-width: 0;
            width: 100%;
            position: relative;
            background: transparent !important;
        }

        .main-svg {
            width: 100%;
            height: 100%;
            display: block;
            min-height: 0;
            min-width: 0;
            pointer-events: none;
            background: transparent !important;
        }
    </style>
</head>
<body>

<div class="terminal-wrapper">
    <main class="stage-container">
        <svg id="viewportSVG" class="main-svg" viewBox="0 0 301 55" preserveAspectRatio="xMidYMid meet">
            <defs>

                        <path d="M 90,60 C 90,44 96,36 106,36 L 158,36 C 170,36 182,44 186,60 C 172,76 170,84 158,84 L 106,84 C 96,84 90,76 90,60 Z" fill="none" stroke-width="3.5" stroke-linejoin="round" />

                        <path d="M 90,60 C 90,51 92,44 100,41 C 92,31 78,14 74,10 C 84,10 94,22 100,30 C 114,34 130,36 142,40 L 210,60 L 142,80 C 130,84 114,86 100,90 C 94,98 84,110 74,110 C 78,106 92,89 100,79 C 90,76 90,70 90,60 Z" fill="none" stroke-width="3.5" stroke-linejoin="round" />

                        <rect x="110" y="32" width="50" height="8" rx="1" fill="none" stroke-width="2.5" />

                        <path d="M 100,80 L 84,96 L 94,96 L 110,80" fill="none" stroke-width="3.2" stroke-linejoin="round" />
                        <circle cx="120" cy="60" r="7.5" fill="none" class="core-ring-8" stroke-width="3.8" />
                        <circle cx="120" cy="60" r="3.2" class="core-dot-8" />
                    </g>
                </g>

                <g id="ship9">
                    <g class="ship-body">
                        <path d="M 90,54 C 85,54 81,55 79,56 L 79,64 C 81,65 85,66 90,66" fill="none" stroke-width="2.6" />
                        <path d="M 90,60 C 90,51 94,44 100,41 C 94,31 82,18 78,14 C 86,14 96,22 102,30 C 114,34 118,34 120,24 L 136,24 L 140,41 C 158,41 210,48 245,60 C 210,72 158,79 140,79 L 120,96 L 106,96 L 102,90 C 96,98 86,106 78,106 C 82,102 94,90 100,79 C 90,76 90,70 90,60 Z" fill="none" stroke-width="3.5" stroke-linejoin="round" />
                        <path d="M 120,24 L 128,12 L 138,12 L 136,24" fill="none" stroke-width="3.2" stroke-linejoin="round" />
                        <line x1="134" y1="14" x2="142" y2="14" stroke-width="2.5" />
                        <path d="M 152,43 L 158,37 L 166,43" fill="none" stroke-width="3.2" />
                        <line x1="158" y1="37" x2="168" y2="35" stroke-width="3" />
                        <path d="M 182,47 L 188,41 L 196,47" fill="none" stroke-width="3.2" />
                        <line x1="188" y1="41" x2="198" y2="39" stroke-width="2.5" />
                        <path d="M 122,50 L 210,54 M 122,70 L 210,66" fill="none" stroke-width="2.5" />
                        <circle cx="128" cy="60" r="7.5" fill="none" class="core-ring-9" stroke-width="3.8" />
                        <circle cx="128" cy="60" r="3.2" class="core-dot-9" />
                    </g>
                </g>
            </defs>

            <g id="stageFleetGroup"></g>
        </svg>
    </main>
</div>

<script>
    const WORLD_W = 301;
    const WORLD_H = 55;
    const NUM_SHIPS = 9;
    const startTime = Date.now(); 

    // 每款飞机专属中心圆环的核心光色
    const CORE_COLORS = {
        1: "#00ffcc", 2: "#ff3344", 3: "#0099ff", 4: "#ffaa00", 5: "#cc33ff",
        6: "#00ffff", 7: "#ff6600", 8: "#33ff33", 9: "#0055ff"
    };

    let lastInputTime = Date.now();
    let lastLaunchTime = 0;
    const COOLDOWN_MS = 250; 

    let fleetDirection = 1; 
    let centerPointX = WORLD_W / 2;
    let centerPointY = 22; 

    class SpaceShipEntity {
        constructor(id) {
            this.id = id;
            this.status = 'FLYING'; 

            this.hangarX = 15 + ((WORLD_W - 30) / (NUM_SHIPS - 1)) * (id - 1);
            this.hangarY = 48; 

            this.x = this.hangarX;
            this.y = 22;

            this.angle = 0;
            this.flipScaleX = 1.0;
            this.sineOffset = id * 1.5;

            this.initDoms();
        }

        initDoms() {
            const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
            g.setAttribute("id", "ship-container-" + this.id);

            // 1. 机库槽车位影
            const shadowUse = document.createElementNS("http://www.w3.org/2000/svg", "g");
            shadowUse.setAttribute("id", "ship-shadow-" + this.id);
            const sUseTag = document.createElementNS("http://www.w3.org/1999/xlink", "xlink:href", "#ship" + this.id);
            shadowUse.appendChild(sUseTag);
            
            let hangarScale = 0.064; 
            shadowUse.setAttribute('transform', "translate(" + this.hangarX + ", " + this.hangarY + ") rotate(-90) scale(" + hangarScale + ", " + hangarScale + ") translate(-135, -60)");
            shadowUse.setAttribute('stroke', '#4e525d'); 
            shadowUse.setAttribute('fill', 'none');
            shadowUse.style.opacity = "0.75"; 

            // 2. 真实空中活动战机
            const entityG = document.createElementNS("http://www.w3.org/2000/svg", "g");
            entityG.setAttribute("id", "ship-active-" + this.id);
            entityG.setAttribute('fill', 'none');

            // 底层发光虚影线 (平替 Glow 滤镜)
            const glowUseTag = document.createElementNS("http://www.w3.org/2000/svg", "use");
            glowUseTag.setAttributeNS("http://www.w3.org/1999/xlink", "xlink:href", "#ship" + this.id);
            glowUseTag.setAttribute('stroke', '#ffffff');
            glowUseTag.setAttribute('stroke-width', '8.0'); 
            glowUseTag.setAttribute('opacity', '0.22');     

            // 顶层实体线
            const mainUseTag = document.createElementNS("http://www.w3.org/2000/svg", "use");
            mainUseTag.setAttributeNS("http://www.w3.org/1999/xlink", "xlink:href", "#ship" + this.id);
            mainUseTag.setAttribute('stroke', '#ffffff');

            // 尾焰双层线条模拟
            const flameOuter = document.createElementNS("http://www.w3.org/2000/svg", "path");
            const flameInner = document.createElementNS("http://www.w3.org/2000/svg", "path");
            flameOuter.setAttribute("fill", "none"); 
            flameOuter.setAttribute("stroke", "#ffffff"); 
            flameOuter.setAttribute("stroke-width", "2.0"); 
            flameOuter.setAttribute("opacity", "0.4");       
            
            flameInner.setAttribute("fill", "none"); 
            flameInner.setAttribute("stroke", "#ffffff"); 
            flameInner.setAttribute("stroke-width", "0.6"); 
            flameInner.setAttribute("opacity", "0.95");

            entityG.appendChild(glowUseTag);
            entityG.appendChild(flameOuter);
            entityG.appendChild(flameInner);
            entityG.appendChild(mainUseTag);

            g.appendChild(shadowUse);
            g.appendChild(entityG);

            document.getElementById("stageFleetGroup").appendChild(g);
            
            this.shadowDom = shadowUse;
            this.activeDom = entityG;
            this.fOuter = flameOuter;
            this.fInner = flameInner;

            // 直接通过标准 CSS 选择器在当前的独立骨架内强制注入专属的核心亮色
            const color = CORE_COLORS[this.id];
            const rings = g.getElementsByClassName('core-ring-' + this.id);
            const dots = g.getElementsByClassName('core-dot-' + this.id);
            for(let i=0; i<rings.length; i++) { rings[i].setAttribute('stroke', color); }
            for(let i=0; i<dots.length; i++) { dots[i].setAttribute('fill', color); }
        }

        takeOff() {
            if (this.status === 'HANGAR' || this.status === 'RETURNING') {
                this.status = 'LAUNCHING';
            }
        }

        dockBack() {
            if (this.status === 'FLYING' || this.status === 'LAUNCHING') {
                this.status = 'RETURNING';
            }
        }

        updatePhysics(indexInFormation, activeCount) {
            let targetX, targetY;
            const microWave = Math.sin(Date.now() * 0.004 + this.sineOffset) * 0.5;

            let baseSize = 0.22;
            let enlargedBase = baseSize * 1.25; 
            
            let fleetScaleFactor = 1.0;
            if (activeCount > 1) {
                fleetScaleFactor = 0.5 + (9 - activeCount) * 0.0625; 
            }
            let currentScale = enlargedBase * fleetScaleFactor;

            if (this.id === 1 && Date.now() - startTime > 10000) {
                let shrinkAge = (Date.now() - startTime - 10000) / 2000; 
                let sizeMultiplier = 1.0 - Math.min(1.0, shrinkAge) * 0.2; 
                currentScale *= sizeMultiplier;
            }

            if (this.status === 'LAUNCHING' || this.status === 'FLYING') {
                this.shadowDom.style.opacity = "0.75"; 
                this.activeDom.style.opacity = "1";

                let dx = 0;
                let dy = 0;
                const gX = 26;  
                const gY = 7.5; 

                const rank = indexInFormation;
                if (rank === 0) { dx = 0; dy = 0; }
                else if (rank === 1) { dx = -gX; dy = -gY; }
                else if (rank === 2) { dx = -gX; dy = gY; }
                else if (rank === 3) { dx = -2 * gX; dy = -2 * gY; }
                else if (rank === 4) { dx = -2 * gX; dy = 0; }
                else if (rank === 5) { dx = -2 * gX; dy = 2 * gY; }
                else if (rank === 6) { dx = -3 * gX; dy = -gY; }
                else if (rank === 7) { dx = -3 * gX; dy = gY; }
                else if (rank === 8) { dx = -4 * gX; dy = 0; }

                targetX = centerPointX + dx;
                targetY = centerPointY + dy + microWave;

                this.x += (targetX - this.x) * 0.06;
                this.y += (targetY - this.y) * 0.06;

                if (this.status === 'LAUNCHING' && Math.abs(this.x - targetX) < 1.5) {
                    this.status = 'FLYING';
                }

                let lookScale = fleetDirection === 1 ? 1.0 : -1.0;
                this.flipScaleX += (lookScale - this.flipScaleX) * 0.08;
                this.angle = (targetY - this.y) * 0.35;

                // 【已修复：补齐了关键的乘号 *】
                this.activeDom.setAttribute('transform', "translate(" + this.x + ", " + this.y + ") rotate(" + this.angle + ") scale(" + (this.flipScaleX * currentScale) + ", " + currentScale + ") translate(-135, -60)");
                this.renderEngineFlame(true);

            } else if (this.status === 'RETURNING') {
                this.shadowDom.style.opacity = "0.75";
                this.activeDom.style.opacity = "1";

                targetX = this.hangarX;
                targetY = this.hangarY;

                this.x += (targetX - this.x) * 0.05;
                this.y += (targetY - this.y) * 0.05;
                
                this.angle += (-90 - this.angle) * 0.07;
                this.flipScaleX += (1.0 - this.flipScaleX) * 0.07;

                if (Math.abs(this.x - targetX) < 0.2 && Math.abs(this.y - targetY) < 0.2) {
                    this.x = targetX;
                    this.y = targetY;
                    this.status = 'HANGAR';
                }

                let hangarScale = 0.064;
                this.activeDom.setAttribute('transform', "translate(" + this.x + ", " + this.y + ") rotate(" + this.angle + ") scale(" + (this.flipScaleX * hangarScale) + ", " + hangarScale + ") translate(-135, -60)");
                this.renderEngineFlame(false);

            } else if (this.status === 'HANGAR') {
                this.shadowDom.style.opacity = "0"; 
                this.activeDom.style.opacity = "1";

                this.x = this.hangarX;
                this.y = this.hangarY;
                this.angle = -90;
                this.flipScaleX = 1.0;

                let hangarScale = 0.064;
                this.activeDom.setAttribute('transform', "translate(" + this.x + ", " + this.y + ") rotate(-90) scale(" + hangarScale + ", " + hangarScale + ") translate(-135, -60)");
                this.renderEngineFlame(false); 
            }
        }

        renderEngineFlame(isFlying) {
            if (!isFlying) {
                this.fOuter.setAttribute('d', '');
                this.fInner.setAttribute('d', '');
                return;
            }
            const rand = Math.random() * 0.3;
            const d1 = "M 78,60 C 78,44 60,43 46,51 C 34,55 " + (16 - rand * 12) + ",60 " + (16 - rand * 12) + ",60 C " + (16 - rand * 12) + ",60 34,65 46,69 C 60,77 78,76 78,60 Z";
            const d2 = "M 78,60 C 78,51 66,51 56,55 C 48,57 36,60 36,60 C 36,60 48,63 56,65 C 66,69 78,69 78,60 Z";
            
            this.fOuter.setAttribute('d', d1);
            this.fInner.setAttribute('d', d2);
        }
    }

    const fleetList = [];
    for (let i = 1; i <= NUM_SHIPS; i++) {
        fleetList.push(new SpaceShipEntity(i));
    }

    window.addEventListener('keydown', (e) => {
        const keyName = e.key;
        
        if (keyName === 'Backspace' || keyName === 'Delete') {
            e.preventDefault();
            const now = Date.now();
            if (now - lastLaunchTime > COOLDOWN_MS) {
                for (let i = NUM_SHIPS - 1; i > 0; i--) {
                    if (fleetList[i].status === 'FLYING' || fleetList[i].status === 'LAUNCHING') {
                        fleetList[i].dockBack(); 
                        lastLaunchTime = now;
                        lastInputTime = now; 
                        break;
                    }
                }
            }
            return;
        }

        if (keyName.length === 1 && /[a-zA-Z]/i.test(keyName)) {
            e.preventDefault();
            const now = Date.now();
            if (now - lastLaunchTime > COOLDOWN_MS) {
                const standbyShip = fleetList.find(s => s.status === 'HANGAR' || s.status === 'RETURNING');
                if (standbyShip) {
                    standbyShip.takeOff(); 
                    lastLaunchTime = now;
                    lastInputTime = now; 
                }
            }
        }
    });

    setInterval(() => {
        if (Date.now() - lastInputTime > 10000) { 
            for (let i = NUM_SHIPS - 1; i > 0; i--) {
                if (fleetList[i].status === 'FLYING' || fleetList[i].status === 'LAUNCHING') {
                    fleetList[i].dockBack();
                    break; 
                }
            }
        }
    }, 1000);

    function handleTenSecondsTransition() {
        const elapsed = Date.now() - startTime;
        if (elapsed > 10000) {
            const step = Math.floor((elapsed - 10000) / 450);
            if (step >= 0 && step < 8) {
                const targetId = 9 - step; 
                const ship = fleetList[targetId - 1];
                if (ship.status === 'FLYING' || ship.status === 'LAUNCHING') {
                    ship.dockBack();
                }
            }
        }
    }

    function updateFrameLoop() {
        centerPointX += 0.26 * fleetDirection;

        if (fleetDirection === 1 && centerPointX > WORLD_W - 55) {
            fleetDirection = -1;
        } else if (fleetDirection === -1 && centerPointX < 55) {
            fleetDirection = 1;
        }

        handleTenSecondsTransition();

        const flyingFormation = fleetList.filter(s => s.status === 'FLYING' || s.status === 'LAUNCHING');

        fleetList.forEach((ship) => {
            const indexInFormation = flyingFormation.indexOf(ship);
            ship.updatePhysics(indexInFormation, flyingFormation.length);
        });

        requestAnimationFrame(updateFrameLoop);
    }

    requestAnimationFrame(updateFrameLoop);
</script>

</body>
</html>
