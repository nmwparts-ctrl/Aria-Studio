<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DS PIXEL PRO - PURE LOW-PROFILE VISUALIZER</title>
    <!-- STREAMING_CHUNK:定义全局磨砂黑色半透明视口与抗锯齿Canvas样式... -->
    <style>
        /* 1. 刚性防溢出与全局盒模型锁定 */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        
        /* 磨砂半透明黑色底座：全局高饱和磨砂折射，透出系统底层壁纸 */
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden !important; /* 绝对禁止出现任何滚动条 */
            background: rgba(6, 6, 9, 0.45) !important; /* 磨砂半透明深色底 */
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            touch-action: none;
            position: relative;
        }

        /* 2. Canvas 裸露铺满全屏 */
        #wf-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
        }

        /* 3. 后台静默辅助节点隐藏区 */
        .hidden-backend-container {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- 主渲染画布 -->
    <canvas id="wf-canvas"></canvas>

    <!-- STREAMING_CHUNK:渲染静默后台DOM槽防止原通信JS报错... -->
    <div class="hidden-backend-container">
        <select id="model-select">
            <option value="gemini" selected>Gemini 最新通道</option>
            <option value="deepseek">DeepSeek 基础通道</option>
        </select>
        <input type="password" id="gemini-key">
        <input type="password" id="deepseek-key">
        <div id="di-audio">H5 MIC Ready</div>
        <div id="chat-box"><div class="message ai-msg">已就绪</div></div>
        <input type="text" id="text-input">
        <div id="debug-log"></div>
        <div id="wf-info"></div>
    </div>
<!-- STREAMING_CHUNK:引入高张力电平限幅自适应控制逻辑... -->
    <script>
        // 声学上下文与分析节点
        let audioCtx = null;
        let analyser = null;
        let dataArray = null;
        let freqArray = null;
        let wfCanvas = null;
        let wfCtx = null;
        let animFrameId = null;

        // 胶囊柱流体动画核心常数
        const TOTAL_BARS = 64;
        const HALF_BARS = TOTAL_BARS / 2;
        const SMOOTHING = 0.03;          // 核心平滑缓冲，交由物理算法控制
        const NOISE_THRESHOLD = 20;      // 噪点截断阈值
        const GRAVITY = 2.4;             // 💥 极速重力系数，保持下落利落性

        // 动画渲染物理缓存
        let renderedHeights = new Array(HALF_BARS).fill(0);
        let fallVelocities = new Array(HALF_BARS).fill(0);
        let peaks = new Array(HALF_BARS).fill(0);
        let peakDropCounters = new Array(HALF_BARS).fill(0);
        let globalTick = 0;              
        let dynamicMax = 180;            // 自适应自平衡能量分母

        // 💥【默认直接开启自动演示模式】，解决初始化及无声状态下的黑屏问题
        let isDemoMode = true;

        function debugLog(msg, type = 'info') {
            console.log(`[${type.toUpperCase()}] ${msg}`);
        }

        /* STREAMING_CHUNK:初始化低延迟音频采集接口，配置安全逃生兜底... */
        // 自动激活麦克风控制核心函数
        async function initVoiceAssistant() {
            if (audioCtx && audioCtx.state === 'running') return;

            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }
            } catch (e) {
                debugLog('❌ AudioContext 激活失败: ' + e.message, 'err');
            }

            try {
                const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                if (audioCtx) {
                    if (!analyser) {
                        analyser = audioCtx.createAnalyser();
                        analyser.fftSize = 512;  
                        analyser.smoothingTimeConstant = SMOOTHING;
                        
                        const source = audioCtx.createMediaStreamSource(micStream);
                        source.connect(analyser);
                        
                        dataArray = new Uint8Array(analyser.fftSize);
                        freqArray = new Uint8Array(analyser.frequencyBinCount);
                    }
                    
                    wfCanvas = document.getElementById('wf-canvas');
                    wfCtx = wfCanvas.getContext('2d');
                    
                    // 💥 物理音频就绪，关闭自演示模式
                    isDemoMode = false;
                    resizeCanvas();
                    window.removeEventListener('resize', resizeCanvas);
                    window.addEventListener('resize', resizeCanvas);
                    
                    if (animFrameId) cancelAnimationFrame(animFrameId);
                    startWaveformRender();
                }
            } catch (err) {
                console.warn("麦克风激活阻断或无设备，系统运行 H5 自动物理电平演示模式: ", err);
                // 即使无物理麦克风，依然挂载画布执行模拟电平演示，绝不黑屏
                if (!wfCanvas) {
                    wfCanvas = document.getElementById('wf-canvas');
                    wfCtx = wfCanvas.getContext('2d');
                    dataArray = new Uint8Array(256);
                    freqArray = new Uint8Array(128);
                    isDemoMode = true;
                    resizeCanvas();
                    window.addEventListener('resize', resizeCanvas);
                    startWaveformRender();
                }
            }
        }

        // 💥【核心修复】：重构 resizeCanvas，采用 setTransform 清洗多重缩放矩阵，彻底解决画布隐形消失问题
        function resizeCanvas() {
            if (!wfCanvas) return;
            const w = window.innerWidth;
            const h = window.innerHeight;
            const dpr = window.devicePixelRatio || 1;
            wfCanvas.width = w * dpr;
            wfCanvas.height = h * dpr;
            if (wfCtx) wfCtx.setTransform(dpr, 0, 0, dpr, 0, 0); // 清除并重新定义缩放对齐
        }

        /* STREAMING_CHUNK:重构8%顶空限幅算法的主绘制循环... */
        // 全模态声波核心渲染引擎
        function startWaveformRender() {
            if (!wfCtx) return;
            const infoEl = document.getElementById('wf-info');

            function draw() {
                animFrameId = requestAnimationFrame(draw);
                const width = wfCanvas.width / window.devicePixelRatio;
                const height = wfCanvas.height / window.devicePixelRatio;
                if (width <= 0 || height <= 0) return;

                if (analyser && !isDemoMode) {
                    analyser.getByteTimeDomainData(dataArray);
                    analyser.getByteFrequencyData(freqArray);
                }

                // 物理计算 RMS 能量有效值
                let sumSq = 0;
                const arrayLen = analyser ? analyser.fftSize : 256;
                for (let i = 0; i < arrayLen; i++) {
                    const v = (analyser && !isDemoMode) ? ((dataArray[i] - 128) / 128) : 0;
                    sumSq += v * v;
                }
                let rms = Math.sqrt(sumSq / arrayLen);
                
                let maxFreqVal = 0, maxFreqIdx = 0;
                const len = freqArray.length;
                for (let i = 0; i < len; i++) {
                    if (freqArray[i] > maxFreqVal) {
                        maxFreqVal = freqArray[i];
                        maxFreqIdx = i;
                    }
                }
                const approxFreq = (analyser && !isDemoMode) ? Math.round(maxFreqIdx * (audioCtx.sampleRate / analyser.fftSize)) : 0;

                // 💥 模拟自演示高动态音乐律动
                if (isDemoMode) {
                    const kickPulse = Math.pow(Math.sin(globalTick * 0.065), 6) * 220; 
                    const bassFlutter = Math.sin(globalTick * 0.02) * 25 + Math.random() * 20;
                    const simulatedBass = Math.max(0, kickPulse + bassFlutter);

                    const simulatedMid = Math.sin(globalTick * 0.04) * 110 + Math.sin(globalTick * 0.091) * 45 + 80;

                    const hatPulse = Math.pow(Math.cos(globalTick * 0.13), 8) * 190;
                    const simulatedTreble = Math.max(0, hatPulse + Math.random() * 40);

                    for (let i = 0; i < freqArray.length; i++) {
                        if (i < 10) freqArray[i] = Math.max(0, simulatedBass - i * 8);
                        else if (i < 45) freqArray[i] = Math.max(0, simulatedMid - Math.abs(i - 25) * 4.5);
                        else freqArray[i] = Math.max(0, simulatedTreble - Math.abs(i - 80) * 2.2);
                    }

                    rms = (simulatedBass * 0.4 + simulatedMid * 0.35 + simulatedTreble * 0.25) / 255 * 0.14;
                }

                if (infoEl) {
                    infoEl.textContent = `RMS: ${rms.toFixed(3)} | FREQ: ${approxFreq}Hz`;
                }

                // 清空画布环境，保持硬件图层完全透光
                wfCtx.clearRect(0, 0, width, height);

                // 后置背景极其纯净的极光微动渲染（不带任何黑玻璃遮挡）
                const slowTime = globalTick * 0.003;
                const orb1X = width * 0.5 + Math.sin(slowTime) * width * 0.25;
                const orb1Y = height * 0.6 + Math.cos(slowTime * 0.8) * height * 0.15;
                const orb2X = width * 0.5 + Math.cos(slowTime * 1.2) * width * 0.3;
                const orb2Y = height * 0.5 + Math.sin(slowTime * 0.9) * height * 0.2;
                
                const grad1 = wfCtx.createRadialGradient(orb1X, orb1Y, 0, orb1X, orb1Y, width * 0.5);
                grad1.addColorStop(0, 'rgba(88, 86, 214, 0.15)');
                grad1.addColorStop(1, 'rgba(0,0,0,0)');
                
                const grad2 = wfCtx.createRadialGradient(orb2X, orb2Y, 0, orb2X, orb2Y, width * 0.45);
                grad2.addColorStop(0, 'rgba(255, 45, 85, 0.12)');
                grad2.addColorStop(1, 'rgba(0,0,0,0)');
                
                wfCtx.fillStyle = grad1;
                wfCtx.fillRect(0, 0, width, height);
                wfCtx.fillStyle = grad2;
                wfCtx.fillRect(0, 0, width, height);

                // STREAMING_CHUNK:计算多频段自适应增益限幅算法...
                // 核心频段收窄平衡映射
                const maxUsefulBin = Math.floor(len * 0.22);
                let currentFramePeak = 0;
                for (let i = 0; i < HALF_BARS; i++) {
                    const sampleIndex = Math.floor(Math.pow((HALF_BARS - 1 - i) / HALF_BARS, 1.6) * maxUsefulBin);
                    const val = freqArray[sampleIndex] || 0;
                    if (val > currentFramePeak) {
                        currentFramePeak = val;
                    }
                }

                // 【防触顶核心控制一：超敏捷自动增益控制 (AGC)】
                const silenceThreshold = NOISE_THRESHOLD + 5;
                const isSilent = currentFramePeak < silenceThreshold;
                if (isSilent) {
                    dynamicMax += (180 - dynamicMax) * 0.1;
                } else {
                    if (currentFramePeak > dynamicMax) {
                        // 爆音瞬间，扩张系数拉满到 0.95，分母瞬间变大从而刚性压制高度，彻底杜绝触顶
                        dynamicMax += (currentFramePeak - dynamicMax) * 0.95;
                    } else {
                        dynamicMax += (currentFramePeak - dynamicMax) * 0.015;
                    }
                }
                const activeRange = Math.max(140, dynamicMax);

                const gap = 6;
                const barWidth = (width - (gap * (TOTAL_BARS - 1))) / TOTAL_BARS;
                
                // 💥【核心修改一：加高垂直可用物理空间上限】
                // 最大高度限制由之前的 58% 大幅度拓宽至屏幕总高度的 92%，释放饱满张力
                const maxHeight = height * 0.92; 

                // 终极极光渐变
                const barGrad = wfCtx.createLinearGradient(0, height, 0, height - maxHeight);
                barGrad.addColorStop(0, '#5856d6');
                barGrad.addColorStop(0.4, '#af52de');
                barGrad.addColorStop(1, '#ff2d55');
                wfCtx.fillStyle = barGrad;

                let peakCapsToDraw = [];
                for (let i = 0; i < HALF_BARS; i++) {
                    const sampleIndex = Math.floor(Math.pow((HALF_BARS - 1 - i) / HALF_BARS, 1.6) * maxUsefulBin);
                    let value = freqArray[sampleIndex] || 0;

                    if (value < NOISE_THRESHOLD) {
                        value = 0;
                    } else {
                        value = value - NOISE_THRESHOLD;
                    }

                    const divisor = Math.max(10, activeRange - NOISE_THRESHOLD);
                    let normalized = value / divisor;

                    // 💥【核心修改二：调高细节频率增益补偿系数，让弹跳更有张力】
                    const bassBoost = 1.0 + Math.sin((i / HALF_BARS) * Math.PI) * 0.35; // 0.20 -> 0.35 恢复饱满澎湃度
                    const trebleCompensation = 1.0 + Math.pow(1.0 - (i / HALF_BARS), 1.6) * 0.45; // 0.25 -> 0.45
                    normalized *= (trebleCompensation * bassBoost);

                    // 💥 恢复合理的中心对称柱能量放大系数，调谐比例
                    const centerDynamicBoost = 1.0 + (i / HALF_BARS) * 0.60; // 0.35 -> 0.60
                    normalized *= centerDynamicBoost;

                    // 💥【防触顶核心控制二：数学对数级数压缩阻尼算法】
                    if (normalized > 0) {
                        normalized = Math.log10(1 + normalized * 9); 
                    }

                    // 💥【核心修改三：锁定极限，保证正好留出 8% 顶空不触顶】
                    // 缩放增益系数拉升至 0.88，且硬限幅锁死在 1.0 以下（也就是 0.88 * 0.92 = 80.9% 屏幕总高区域）
                    // 即使在极高分贝爆音冲击下，顶部也将物理性精确留下 8%~12% 留白负空间，决不撞墙、绝不平头
                    let targetPercent = Math.min(1.0, normalized * 0.88);
                    const targetHeight = targetPercent * maxHeight;

                    if (targetHeight >= renderedHeights[i]) {
                        renderedHeights[i] = targetHeight;
                        fallVelocities[i] = 0;
                    } else {
                        fallVelocities[i] += GRAVITY;
                        renderedHeights[i] -= fallVelocities[i];
                        if (renderedHeights[i] < targetHeight) {
                            renderedHeights[i] = targetHeight;
                            fallVelocities[i] = 0;
                        }
                    }

                    // 细腻的物理环境呼吸波动
                    const breathIntensity = isSilent ? 0.05 : 1.0;
                    const breathWave = Math.sin(globalTick * 0.05 + i * 0.15) * 0.5 * breathIntensity + (0.5 * breathIntensity);
                    const currentH = Math.max(2.0 + breathWave, renderedHeights[i]);
                    
                    // 贴死在物理最底端（边距设为 0px）
                    const y = height - currentH; 
                    const leftX = i * (barWidth + gap);
                    const rightX = width - barWidth - (i * (barWidth + gap));
                    
                    // 绘制胶囊
                    drawCapsule(wfCtx, leftX, y, barWidth, currentH, barWidth / 2);
                    drawCapsule(wfCtx, rightX, y, barWidth, currentH, barWidth / 2);

                    // 悬浮能量帽断点物理
                    if (y < peaks[i]) {
                        peaks[i] = y;
                        peakDropCounters[i] = 0;
                    } else {
                        peakDropCounters[i] += 1;
                        if (peakDropCounters[i] > 4) {
                            peaks[i] += 2.8; 
                        }
                    }
                    if (peaks[i] > height) peaks[i] = height;
                    peakCapsToDraw.push({ lx: leftX + barWidth/2, rx: rightX + barWidth/2, ty: peaks[i] });
                }

                // 渲染精细悬浮发光珍珠帽
                peakCapsToDraw.forEach((cap) => {
                    wfCtx.save();
                    wfCtx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                    wfCtx.shadowColor = 'rgba(255, 255, 255, 0.6)';
                    wfCtx.shadowBlur = 4;
                    wfCtx.beginPath();
                    wfCtx.arc(cap.lx, cap.ty - 5, Math.max(1.5, barWidth * 0.18), 0, Math.PI * 2);
                    wfCtx.arc(cap.rx, cap.ty - 5, Math.max(1.5, barWidth * 0.18), 0, Math.PI * 2);
                    wfCtx.fill();
                    wfCtx.restore();
                });
                globalTick++;
            }
            draw();
        }

        function drawCapsule(ctx, x, y, w, h, r) {
            if (h <= 0) return;
            ctx.beginPath();
            const radius = Math.min(r, w / 2, h / 2);
            ctx.roundRect(x, y, w, h, radius);
            ctx.fill();
        }

        window.addEventListener('load', () => {
            initVoiceAssistant();
        });

        // 全物理交互环境无感唤醒
        const silentActivate = () => {
            initVoiceAssistant();
            document.removeEventListener('click', silentActivate);
            document.removeEventListener('keydown', silentActivate);
            document.removeEventListener('touchstart', silentActivate);
        };

        document.addEventListener('click', silentActivate);
        document.addEventListener('keydown', silentActivate);
        document.addEventListener('touchstart', silentActivate);
    </script>
</body>
</html>
